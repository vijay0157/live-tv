name: Build Standalone Android TV APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Android Debug APK
      run: |
        cd android
        gradle assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OTT-Navigator-Live-TV-Debug-APK
        path: android/app/build/outputs/apk/debug/*.apk

    - name: Create GitHub Release with APK
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/heads/main')
      with:
        tag_name: v1.0.0-android
        name: OTT Navigator Live TV Android Release
        body: |
          ### 📺 Standalone Android TV & Phone APK
          - Runs completely on the Android device with **zero external servers**.
          - Inbuilt local HTTP proxy spoofing `User-Agent: OTT Navigator/1.7.0.2` on `127.0.0.1:8085`.
          - Full 1080p 50fps Star Sports, EPG, Remote Control, and 2,193 Live Channels.
          - No PC needed!
        files: android/app/build/outputs/apk/debug/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
